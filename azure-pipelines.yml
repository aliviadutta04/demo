trigger:
  - main

parameters:

- name: cucumberTag
  displayName: 'Select Cucumber Tag'
  type: string
  default: '@smoke'
  values:
    - '@smoke'
    - '@negative'
    - '@employee'
    - '@dataDriven'
    - '@smokeDataDriven'
    - '@role'
    - '@loginNegative'

- name: environment
  displayName: 'Target Environment'
  type: string
  default: 'dev'
  values:
    - 'dev'
    - 'qa'
    - 'prod'

- name: cucumberThreads
  displayName: 'Parallel Scenario Threads'
  type: string
  default: '3'

pool:
  vmImage: 'ubuntu-latest'

steps:

# --------------------------------------------------
# 1. Display selected Cucumber tag
# --------------------------------------------------

- script: |
    echo "======================================"
    echo "Selected Cucumber Tag:"
    echo "${{ parameters.cucumberTag }}"
    echo "======================================"
  displayName: 'Display Selected Tag'


# --------------------------------------------------
# 2. Setup Java 21
# --------------------------------------------------

- task: JavaToolInstaller@0
  inputs:
    versionSpec: '21'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  displayName: 'Setup Java 21'

- script: |
    sudo apt-get update -qq
    sudo apt-get install -y ffmpeg
  displayName: 'Install FFmpeg for HTML Video Playback'

- task: Cache@2
  inputs:
    key: 'maven | "$(Agent.OS)" | **/pom.xml'
    restoreKeys: |
      maven | "$(Agent.OS)"
      maven
    path: '$(Pipeline.Workspace)/.m2/repository'
  displayName: 'Cache Maven Dependencies'


# --------------------------------------------------
# 3. Verify Java and Maven
# --------------------------------------------------

- script: |
    java -version
    mvn -version
  displayName: 'Verify Java and Maven'

- script: |
    require_secret() {
      name="$1"
      value="$2"
      if [ -z "$value" ] || [[ "$value" == \$\(*\) ]]; then
        echo "Missing Azure DevOps secret variable: $name"
        return 1
      fi
    }

    if [ '${{ parameters.cucumberTag }}' != '@loginNegative' ]; then
      require_secret ORANGEHRM_USERNAME "$ORANGEHRM_USERNAME" || exit 1
      require_secret ORANGEHRM_PASSWORD "$ORANGEHRM_PASSWORD" || exit 1
    fi

    if [ '${{ parameters.cucumberTag }}' = '@role' ]; then
      require_secret ORANGEHRM_ESS_USERNAME "$ORANGEHRM_ESS_USERNAME" || exit 1
      require_secret ORANGEHRM_ESS_PASSWORD "$ORANGEHRM_ESS_PASSWORD" || exit 1
    fi
  env:
    ORANGEHRM_USERNAME: $(ORANGEHRM_USERNAME)
    ORANGEHRM_PASSWORD: $(ORANGEHRM_PASSWORD)
    ORANGEHRM_ESS_USERNAME: $(ORANGEHRM_ESS_USERNAME)
    ORANGEHRM_ESS_PASSWORD: $(ORANGEHRM_ESS_PASSWORD)
  displayName: 'Validate Azure Secret Variables'


# --------------------------------------------------
# 4. Run Selenium Cucumber Tests
# --------------------------------------------------

- script: |
    echo "======================================"
    echo "Running Selenium Cucumber Tests"
    echo "Tag: ${{ parameters.cucumberTag }}"
    echo "======================================"

    xvfb-run --auto-servernum mvn -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository clean test \
      -Dtest=CucumberTest \
      -Denv=${{ parameters.environment }} \
      -Dcucumber.threads=${{ parameters.cucumberThreads }} \
      -Dheadless=false \
      "-Dcucumber.filter.tags=(${{ parameters.cucumberTag }}) and not @quarantine"
  env:
    ORANGEHRM_USERNAME: $(ORANGEHRM_USERNAME)
    ORANGEHRM_PASSWORD: $(ORANGEHRM_PASSWORD)
    ORANGEHRM_ESS_USERNAME: $(ORANGEHRM_ESS_USERNAME)
    ORANGEHRM_ESS_PASSWORD: $(ORANGEHRM_ESS_PASSWORD)
  displayName: 'Run Selenium Cucumber Tests'


# --------------------------------------------------
# 5. Print Surefire Error Details
# --------------------------------------------------

- script: |
    echo "======================================"
    echo "SUREFIRE REPORTS"
    echo "======================================"

    if [ -d "target/surefire-reports" ]; then

      echo "Surefire files:"
      find target/surefire-reports -maxdepth 1 -type f -print

      echo ""
      echo "======================================"
      echo "SUREFIRE TEST REPORT CONTENT"
      echo "======================================"

      for file in target/surefire-reports/*.txt; do
        if [ -f "$file" ]; then
          echo ""
          echo "--------------------------------------"
          echo "File: $file"
          echo "--------------------------------------"
          cat "$file"
        fi
      done

    else

      echo "No target/surefire-reports directory found."

    fi
  condition: succeededOrFailed()
  displayName: 'Print Surefire Test Results'


# --------------------------------------------------
# 6. Publish JUnit Test Results
# --------------------------------------------------

- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
    failTaskOnFailedTests: false
    testRunTitle: 'OrangeHRM Selenium Cucumber Tests'
  displayName: 'Publish Test Results'


# --------------------------------------------------
# 7. Publish Cucumber HTML Report
# --------------------------------------------------

- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: 'target/cucumber-report'
    ArtifactName: 'Cucumber-HTML-Report'
    publishLocation: 'Container'
  displayName: 'Publish Cucumber HTML Report'


# --------------------------------------------------
# 8. Ensure Screenshot Directory Exists
# --------------------------------------------------

- script: |
    echo "Checking screenshot directory..."

    if [ -d "target/screenshots" ]; then
      echo "Screenshot directory already exists."
      echo "Files:"
      find target/screenshots -type f -print
    else
      echo "No screenshots were generated."
      echo "Creating empty screenshot directory..."
      mkdir -p target/screenshots
    fi
  condition: succeededOrFailed()
  displayName: 'Ensure Screenshot Directory'


# --------------------------------------------------
# 9. Publish Failure Screenshots
# --------------------------------------------------

- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: 'target/screenshots'
    ArtifactName: 'Failure-Screenshots'
    publishLocation: 'Container'
  displayName: 'Publish Failure Screenshots'

- script: |
    mkdir -p target/videos
    find target/videos -type f -print
  condition: succeededOrFailed()
  displayName: 'Prepare Recorded Videos'

- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: 'target/videos'
    ArtifactName: 'Test-Videos'
    publishLocation: 'Container'
  displayName: 'Publish Test Videos'

- script: mkdir -p target/flaky-tests
  condition: succeededOrFailed()
  displayName: 'Prepare Flaky-Test Report'

- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: 'target/flaky-tests'
    ArtifactName: 'Flaky-Test-Retry-Events'
    publishLocation: 'Container'
  displayName: 'Publish Flaky-Test Retry Events'