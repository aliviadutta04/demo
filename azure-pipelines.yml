trigger: none

parameters:

- name: employeeTag
  displayName: 'Employee Feature Tag'
  type: string
  default: '@smoke'
  values:
    - '@smoke'
    - '@negative'

- name: dataDrivenTag
  displayName: 'Data Driven Feature Tag'
  type: string
  default: '@dataDriven'
  values:
    - '@dataDriven'
    - '@smokeDataDriven'


# ==================================================
# STAGES
# ==================================================

stages:


# ==================================================
# STAGE 1 - EMPLOYEE FEATURE
# ==================================================

- stage: EmployeeTests

  displayName: 'Employee Feature Tests'

  jobs:

  - job: EmployeeFeature

    displayName: 'Run Employee Feature'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # ----------------------------------------------
    # 1. Display Selected Tag
    # ----------------------------------------------

    - script: |

        echo "======================================"
        echo "Employee Feature"
        echo "Selected Tag: ${{ parameters.employeeTag }}"
        echo "======================================"

      displayName: 'Display Employee Tag'


    # ----------------------------------------------
    # 2. Setup Java
    # ----------------------------------------------

    - task: JavaToolInstaller@0

      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

      displayName: 'Setup Java 21'


    # ----------------------------------------------
    # 3. Verify Java and Maven
    # ----------------------------------------------

    - script: |

        java -version
        mvn -version

      displayName: 'Verify Java and Maven'


    # ----------------------------------------------
    # 4. Run Employee Tests
    # ----------------------------------------------

    - script: |

        echo "Running Employee Tests"
        echo "Tag: ${{ parameters.employeeTag }}"

        mvn clean test \
          -Dheadless=true \
          "-Dcucumber.filter.tags=${{ parameters.employeeTag }}"

      displayName: 'Run Employee Tests'


    # ----------------------------------------------
    # 5. Publish JUnit
    # ----------------------------------------------

    - task: PublishTestResults@2

      condition: succeededOrFailed()

      inputs:

        testResultsFormat: 'JUnit'

        testResultsFiles: |
          **/target/surefire-reports/TEST-*.xml

        failTaskOnFailedTests: false

        testRunTitle: 'Employee - ${{ parameters.employeeTag }}'

      displayName: 'Publish Employee Test Results'


    # ----------------------------------------------
    # 6. Publish HTML Report
    # ----------------------------------------------

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/cucumber-report'

        ArtifactName: 'Employee-Report-${{ parameters.employeeTag }}'

        publishLocation: 'Container'

      displayName: 'Publish Employee HTML Report'


    # ----------------------------------------------
    # 7. Publish Screenshots
    # ----------------------------------------------

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/screenshots'

        ArtifactName: 'Employee-Screenshots-${{ parameters.employeeTag }}'

        publishLocation: 'Container'

      displayName: 'Publish Employee Screenshots'


# ==================================================
# STAGE 2 - DATA DRIVEN FEATURE
# ==================================================

- stage: DataDrivenTests

  displayName: 'Data Driven Feature Tests'

  dependsOn: EmployeeTests

  condition: succeeded()

  jobs:

  - job: DataDrivenFeature

    displayName: 'Run Data Driven Feature'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # ----------------------------------------------
    # 1. Display Tag
    # ----------------------------------------------

    - script: |

        echo "======================================"
        echo "Data Driven Feature"
        echo "Selected Tag: ${{ parameters.dataDrivenTag }}"
        echo "======================================"

      displayName: 'Display Data Driven Tag'


    # ----------------------------------------------
    # 2. Setup Java
    # ----------------------------------------------

    - task: JavaToolInstaller@0

      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

      displayName: 'Setup Java 21'


    # ----------------------------------------------
    # 3. Verify Java and Maven
    # ----------------------------------------------

    - script: |

        java -version
        mvn -version

      displayName: 'Verify Java and Maven'


    # ----------------------------------------------
    # 4. Run Data Driven Tests
    # ----------------------------------------------

    - script: |

        echo "Running Data Driven Tests"
        echo "Tag: ${{ parameters.dataDrivenTag }}"

        mvn clean test \
          -Dheadless=true \
          "-Dcucumber.filter.tags=${{ parameters.dataDrivenTag }}"

      displayName: 'Run Data Driven Tests'


    # ----------------------------------------------
    # 5. Publish JUnit
    # ----------------------------------------------

    - task: PublishTestResults@2

      condition: succeededOrFailed()

      inputs:

        testResultsFormat: 'JUnit'

        testResultsFiles: |
          **/target/surefire-reports/TEST-*.xml

        failTaskOnFailedTests: false

        testRunTitle: 'Data Driven - ${{ parameters.dataDrivenTag }}'

      displayName: 'Publish Data Driven Results'


    # ----------------------------------------------
    # 6. Publish HTML
    # ----------------------------------------------

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/cucumber-report'

        ArtifactName: 'DataDriven-Report-${{ parameters.dataDrivenTag }}'

        publishLocation: 'Container'

      displayName: 'Publish Data Driven HTML Report'


    # ----------------------------------------------
    # 7. Publish Screenshots
    # ----------------------------------------------

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/screenshots'

        ArtifactName: 'DataDriven-Screenshots-${{ parameters.dataDrivenTag }}'

        publishLocation: 'Container'

      displayName: 'Publish Data Driven Screenshots'