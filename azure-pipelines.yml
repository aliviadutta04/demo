trigger: none

parameters:

* name: employeeTag
  displayName: 'Select Cucumber Tag'
  type: string
  default: '@smoke'
  values:

  * '@smoke'
  * '@negative'
  * '@employee'
  * '@dataDriven'
  * '@smokeDataDriven'

# ==================================================

# STAGES

# ==================================================

stages:

# ==================================================

# STAGE 1 - RUN SELECTED CUCUMBER TAG

# ==================================================

* stage: CucumberTests

  displayName: 'Selected Cucumber Tests'

  jobs:

  * job: CucumberTestsJob

    displayName: 'Run Selected Cucumber Tests'

    pool:
    vmImage: 'ubuntu-latest'

    steps:

    # ----------------------------------------------

    # 1. Display Selected Tag

    # ----------------------------------------------

    * script: |
      echo "======================================"
      echo "Selected Cucumber Tag:"
      echo "${{ parameters.employeeTag }}"
      echo "======================================"

      displayName: 'Display Selected Tag'

    # ----------------------------------------------

    # 2. Setup Java 21

    # ----------------------------------------------

    * task: JavaToolInstaller@0
      displayName: 'Setup Java 21'
      inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

    # ----------------------------------------------

    # 3. Verify Java and Maven

    # ----------------------------------------------

    * script: |
      java -version
      mvn -version

      displayName: 'Verify Java and Maven'

    # ----------------------------------------------

    # 4. Run Selected Cucumber Tests

    # ----------------------------------------------

    * script: |
      echo "======================================"
      echo "Running Selected Cucumber Tests"
      echo "Tag: ${{ parameters.employeeTag }}"
      echo "======================================"

      mvn clean test 
      -Dheadless=true 
      "-Dcucumber.filter.tags=${{ parameters.employeeTag }}"

      displayName: 'Run Selected Cucumber Tests'

    # ----------------------------------------------

    # 5. Print Surefire Results

    # ----------------------------------------------

    * script: |
      echo "======================================"
      echo "SUREFIRE TEST RESULTS"
      echo "======================================"

      if [ -d "target/surefire-reports" ]; then
      find target/surefire-reports -maxdepth 1 -type f -print

      ```
      for file in target/surefire-reports/*.txt; do
        if [ -f "$file" ]; then
          echo "--------------------------------------"
          echo "File: $file"
          cat "$file"
        fi
      done
      ```

      else
      echo "No Surefire reports found."
      fi

      condition: succeededOrFailed()
      displayName: 'Print Surefire Test Results'

    # ----------------------------------------------

    # 6. Publish JUnit Results

    # ----------------------------------------------

    * task: PublishTestResults@2
      condition: succeededOrFailed()
      displayName: 'Publish Cucumber Test Results'
      inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      searchFolder: '$(System.DefaultWorkingDirectory)'
      mergeTestResults: true
      failTaskOnFailedTests: false
      testRunTitle: 'Cucumber - ${{ parameters.employeeTag }}'

    # ----------------------------------------------

    # 7. Prepare HTML Report Directory

    # ----------------------------------------------

    * script: |
      mkdir -p target/cucumber-report

      echo "Cucumber HTML Report Files:"
      find target/cucumber-report -type f -print

      condition: succeededOrFailed()
      displayName: 'Prepare HTML Report Directory'

    # ----------------------------------------------

    # 8. Publish Cucumber HTML Report

    # ----------------------------------------------

    * task: PublishBuildArtifacts@1
      condition: succeededOrFailed()
      displayName: 'Publish Cucumber HTML Report'
      inputs:
      PathtoPublish: 'target/cucumber-report'
      ArtifactName: 'Cucumber-Report'
      publishLocation: 'Container'

    # ----------------------------------------------

    # 9. Prepare Screenshot Directory

    # ----------------------------------------------

    * script: |
      mkdir -p target/screenshots

      echo "Screenshot Files:"
      find target/screenshots -type f -print

      condition: succeededOrFailed()
      displayName: 'Prepare Screenshot Directory'

    # ----------------------------------------------

    # 10. Publish Failure Screenshots

    # ----------------------------------------------

    * task: PublishBuildArtifacts@1
      condition: succeededOrFailed()
      displayName: 'Publish Failure Screenshots'
      inputs:
      PathtoPublish: 'target/screenshots'
      ArtifactName: 'Failure-Screenshots'
      publishLocation: 'Container'
