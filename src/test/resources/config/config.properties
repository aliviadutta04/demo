environment=dev
env.file.paths=demo/.env,.env
browser=chrome
headless=false
browser.width=1920
browser.height=1080
timeout=15
role.absenceTimeout=2
employee.id.maxLength=10
employee.api.endpoint=/api/v2/pim/employees
employee.api.successStatus=200
employee.cleanup.successStatuses=200,204
testdata.uniqueSuffixLength=8
testdata.invalidUsernamePrefix=unknown_
browser.chrome.arguments=--no-sandbox,--disable-dev-shm-usage,--disable-notifications
browser.chrome.headlessArgument=--headless=new
browser.edge.arguments=--no-sandbox,--disable-dev-shm-usage,--disable-notifications
browser.edge.headlessArgument=--headless=new
browser.firefox.headlessArgument=-headless
browser.firefox.notificationPreference=dom.webnotifications.enabled
browser.firefox.notificationsEnabled=false
retry.maxAttempts=2
retry.report=target/flaky-tests/retry-events.csv
screenshots.folder=target/screenshots
video.folder=target/videos
video.sourceExtension=.avi
video.convertedExtension=.mp4
video.ffmpeg.executable=ffmpeg
video.ffmpeg.inputArguments=-y,-i
video.ffmpeg.outputArguments=-an,-c:v,libx264,-preset,ultrafast,-crf,28,-pix_fmt,yuv420p,-movflags,+faststart
video.ffmpeg.timeoutSeconds=120
tags.loginNegative=@loginNegative
parallel.tag=@parallel