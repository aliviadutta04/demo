trigger: none

variables:
  environment: 'qa'
  cucumberThreads: 3


# ==================================================
# STAGES
# ==================================================

stages:


# ==================================================
# STAGE 1 - EMPLOYEE FEATURE
# @smoke and @negative will run in PARALLEL
# ==================================================

- stage: EmployeeTests

  displayName: 'Employee Feature Tests'

  jobs:

  - job: EmployeeFeature

    displayName: 'Employee Tests - Parallel Tags'

    strategy:

      matrix:

        Smoke:
          cucumberTag: '@smoke'

        Negative:
          cucumberTag: '@negative'

      maxParallel: 2

    pool:
      vmImage: 'ubuntu-latest'


    steps:


    # ==================================================
    # 1. DISPLAY CURRENT TAG
    # ==================================================

    - script: |

        echo "======================================"
        echo "Employee Feature"
        echo "Running Tag: $(cucumberTag)"
        echo "======================================"

      displayName: 'Display Employee Tag'


    # ==================================================
    # 2. SETUP JAVA 21
    # ==================================================

    - task: JavaToolInstaller@0

      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

      displayName: 'Setup Java 21'

    - script: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg
      displayName: 'Install FFmpeg for HTML Video Playback'

    - task: Cache@2
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
          maven
        path: '$(Pipeline.Workspace)/.m2/repository'
      displayName: 'Cache Maven Dependencies'


    # ==================================================
    # 3. VERIFY JAVA AND MAVEN
    # ==================================================

    - script: |

        echo "Java Version:"
        java -version

        echo ""
        echo "Maven Version:"
        mvn -version

      displayName: 'Verify Java and Maven'


    - script: |
        require_secret() {
          name="$1"
          value="$2"
          if [ -z "$value" ] || [[ "$value" == \$\(*\) ]]; then
            echo "Missing Azure DevOps secret variable: $name"
            return 1
          fi
        }

        require_secret ORANGEHRM_USERNAME "$ORANGEHRM_USERNAME" || exit 1
        require_secret ORANGEHRM_PASSWORD "$ORANGEHRM_PASSWORD" || exit 1
      env:
        ORANGEHRM_USERNAME: $(ORANGEHRM_USERNAME)
        ORANGEHRM_PASSWORD: $(ORANGEHRM_PASSWORD)
      displayName: 'Validate Azure Admin Secrets'


    # ==================================================
    # 4. RUN EMPLOYEE TESTS
    # ==================================================

    - script: |

        echo "======================================"
        echo "Running Employee Tests"
        echo "Tag: $(cucumberTag)"
        echo "======================================"

        xvfb-run --auto-servernum mvn -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository clean test \
          -Dtest=CucumberTest \
          -Denv=$(environment) \
          -Dcucumber.threads=$(cucumberThreads) \
          -Dheadless=false \
          "-Dcucumber.filter.tags=($(cucumberTag)) and not @quarantine"

      env:
        ORANGEHRM_USERNAME: $(ORANGEHRM_USERNAME)
        ORANGEHRM_PASSWORD: $(ORANGEHRM_PASSWORD)
        ORANGEHRM_ESS_USERNAME: $(ORANGEHRM_ESS_USERNAME)
        ORANGEHRM_ESS_PASSWORD: $(ORANGEHRM_ESS_PASSWORD)

      displayName: 'Run Employee Tests'


    # ==================================================
    # 5. PUBLISH JUNIT RESULTS
    # ==================================================

    - task: PublishTestResults@2

      condition: succeededOrFailed()

      inputs:

        testResultsFormat: 'JUnit'

        testResultsFiles: |
          **/target/surefire-reports/TEST-*.xml

        failTaskOnFailedTests: false

        testRunTitle: 'Employee - $(cucumberTag)'

      displayName: 'Publish Employee Test Results'


    # ==================================================
    # 6. PREPARE CUCUMBER HTML REPORT
    # ==================================================

    - script: |

        echo "======================================"
        echo "Preparing Cucumber HTML Report"
        echo "======================================"

        mkdir -p target/cucumber-report

        echo "Report directory:"
        ls -la target/cucumber-report

      condition: succeededOrFailed()

      displayName: 'Prepare Cucumber Report'


    # ==================================================
    # 7. PUBLISH CUCUMBER HTML REPORT
    # ==================================================

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/cucumber-report'

        ArtifactName: 'Employee-Report-$(cucumberTag)'

        publishLocation: 'Container'

      displayName: 'Publish Employee HTML Report'


    # ==================================================
    # 8. PREPARE SCREENSHOTS
    # ==================================================

    - script: |

        echo "======================================"
        echo "Preparing Screenshots"
        echo "======================================"

        mkdir -p target/screenshots

        echo ""
        echo "Screenshot files:"
        find target/screenshots -type f -print || true

        echo ""
        echo "Screenshot directory:"
        ls -la target/screenshots

      condition: succeededOrFailed()

      displayName: 'Prepare Screenshots'


    # ==================================================
    # 9. PUBLISH SCREENSHOTS
    # ==================================================

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/screenshots'

        ArtifactName: 'Employee-Screenshots-$(cucumberTag)'

        publishLocation: 'Container'

      displayName: 'Publish Employee Screenshots'

    - script: |
        mkdir -p target/videos
        find target/videos -type f -print
      condition: succeededOrFailed()
      displayName: 'Prepare Videos'

    - task: PublishBuildArtifacts@1
      condition: succeededOrFailed()
      inputs:
        PathtoPublish: 'target/videos'
        ArtifactName: 'Employee-Videos-$(cucumberTag)'
        publishLocation: 'Container'
      displayName: 'Publish Videos'

    - script: mkdir -p target/flaky-tests
      condition: succeededOrFailed()
      displayName: 'Prepare Flaky-Test Report'

    - task: PublishBuildArtifacts@1
      condition: succeededOrFailed()
      inputs:
        PathtoPublish: 'target/flaky-tests'
        ArtifactName: 'Flaky-Test-Retry-Events-$(cucumberTag)'
        publishLocation: 'Container'
      displayName: 'Publish Flaky-Test Retry Events'