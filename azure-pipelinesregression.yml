trigger: none


# ==================================================
# STAGES
# ==================================================

stages:


# ==================================================
# STAGE 1 - EMPLOYEE FEATURE
# @smoke and @negative will run in PARALLEL
# ==================================================

- stage: EmployeeTests

  displayName: 'Employee Feature Tests'

  jobs:

  - job: EmployeeFeature

    displayName: 'Employee Tests - Parallel Tags'

    strategy:

      matrix:

        Smoke:
          cucumberTag: '@smoke'

        Negative:
          cucumberTag: '@negative'

      maxParallel: 2

    pool:
      vmImage: 'ubuntu-latest'


    steps:


    # ==================================================
    # 1. DISPLAY CURRENT TAG
    # ==================================================

    - script: |

        echo "======================================"
        echo "Employee Feature"
        echo "Running Tag: $(cucumberTag)"
        echo "======================================"

      displayName: 'Display Employee Tag'


    # ==================================================
    # 2. SETUP JAVA 21
    # ==================================================

    - task: JavaToolInstaller@0

      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

      displayName: 'Setup Java 21'


    # ==================================================
    # 3. VERIFY JAVA AND MAVEN
    # ==================================================

    - script: |

        echo "Java Version:"
        java -version

        echo ""
        echo "Maven Version:"
        mvn -version

      displayName: 'Verify Java and Maven'


    # ==================================================
    # 4. RUN EMPLOYEE TESTS
    # ==================================================

    - script: |

        echo "======================================"
        echo "Running Employee Tests"
        echo "Tag: $(cucumberTag)"
        echo "======================================"

        mvn clean test \
          -Dheadless=true \
          "-Dcucumber.filter.tags=$(cucumberTag)"

      displayName: 'Run Employee Tests'


    # ==================================================
    # 5. PUBLISH JUNIT RESULTS
    # ==================================================

    - task: PublishTestResults@2

      condition: succeededOrFailed()

      inputs:

        testResultsFormat: 'JUnit'

        testResultsFiles: |
          **/target/surefire-reports/TEST-*.xml

        failTaskOnFailedTests: false

        testRunTitle: 'Employee - $(cucumberTag)'

      displayName: 'Publish Employee Test Results'


    # ==================================================
    # 6. PREPARE CUCUMBER HTML REPORT
    # ==================================================

    - script: |

        echo "======================================"
        echo "Preparing Cucumber HTML Report"
        echo "======================================"

        mkdir -p target/cucumber-report

        echo "Report directory:"
        ls -la target/cucumber-report

      condition: succeededOrFailed()

      displayName: 'Prepare Cucumber Report'


    # ==================================================
    # 7. PUBLISH CUCUMBER HTML REPORT
    # ==================================================

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/cucumber-report'

        ArtifactName: 'Employee-Report-$(cucumberTag)'

        publishLocation: 'Container'

      displayName: 'Publish Employee HTML Report'


    # ==================================================
    # 8. PREPARE SCREENSHOTS
    # ==================================================

    - script: |

        echo "======================================"
        echo "Preparing Screenshots"
        echo "======================================"

        mkdir -p target/screenshots

        echo ""
        echo "Screenshot files:"
        find target/screenshots -type f -print || true

        echo ""
        echo "Screenshot directory:"
        ls -la target/screenshots

      condition: succeededOrFailed()

      displayName: 'Prepare Screenshots'


    # ==================================================
    # 9. PUBLISH SCREENSHOTS
    # ==================================================

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/screenshots'

        ArtifactName: 'Employee-Screenshots-$(cucumberTag)'

        publishLocation: 'Container'

      displayName: 'Publish Employee Screenshots'



# ==================================================
# STAGE 2 - DATA DRIVEN FEATURE
# Runs after Employee stage
# ==================================================

- stage: DataDrivenTests

  displayName: 'Data Driven Feature Tests'

  dependsOn: EmployeeTests

  condition: succeeded()

  jobs:

  - job: DataDrivenFeature

    displayName: 'Run Data Driven Feature'

    pool:
      vmImage: 'ubuntu-latest'


    steps:


    # ==================================================
    # 1. DISPLAY DATA DRIVEN TAG
    # ==================================================

    - script: |

        echo "======================================"
        echo "Data Driven Feature"
        echo "Running Tag: @dataDriven"
        echo "======================================"

      displayName: 'Display Data Driven Tag'


    # ==================================================
    # 2. SETUP JAVA 21
    # ==================================================

    - task: JavaToolInstaller@0

      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

      displayName: 'Setup Java 21'


    # ==================================================
    # 3. VERIFY JAVA AND MAVEN
    # ==================================================

    - script: |

        echo "Java Version:"
        java -version

        echo ""
        echo "Maven Version:"
        mvn -version

      displayName: 'Verify Java and Maven'


    # ==================================================
    # 4. RUN DATA DRIVEN TESTS
    # ==================================================

    - script: |

        echo "======================================"
        echo "Running Data Driven Feature"
        echo "Tag: @dataDriven"
        echo "======================================"

        mvn clean test \
          -Dheadless=true \
          "-Dcucumber.filter.tags=@dataDriven"

      displayName: 'Run Data Driven Tests'


    # ==================================================
    # 5. PUBLISH JUNIT RESULTS
    # ==================================================

    - task: PublishTestResults@2

      condition: succeededOrFailed()

      inputs:

        testResultsFormat: 'JUnit'

        testResultsFiles: |
          **/target/surefire-reports/TEST-*.xml

        failTaskOnFailedTests: false

        testRunTitle: 'Data Driven - @dataDriven'

      displayName: 'Publish Data Driven Results'


    # ==================================================
    # 6. PREPARE CUCUMBER HTML REPORT
    # ==================================================

    - script: |

        echo "======================================"
        echo "Preparing Cucumber HTML Report"
        echo "======================================"

        mkdir -p target/cucumber-report

        echo "Report directory:"
        ls -la target/cucumber-report

      condition: succeededOrFailed()

      displayName: 'Prepare Cucumber Report'


    # ==================================================
    # 7. PUBLISH CUCUMBER HTML REPORT
    # ==================================================

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/cucumber-report'

        ArtifactName: 'DataDriven-Report'

        publishLocation: 'Container'

      displayName: 'Publish Data Driven HTML Report'


    # ==================================================
    # 8. PREPARE SCREENSHOTS
    # ==================================================

    - script: |

        echo "======================================"
        echo "Preparing Screenshots"
        echo "======================================"

        mkdir -p target/screenshots

        echo ""
        echo "Screenshot files:"
        find target/screenshots -type f -print || true

        echo ""
        echo "Screenshot directory:"
        ls -la target/screenshots

      condition: succeededOrFailed()

      displayName: 'Prepare Screenshots'


    # ==================================================
    # 9. PUBLISH SCREENSHOTS
    # ==================================================

    - task: PublishBuildArtifacts@1

      condition: succeededOrFailed()

      inputs:

        PathtoPublish: 'target/screenshots'

        ArtifactName: 'DataDriven-Screenshots'

        publishLocation: 'Container'

      displayName: 'Publish Data Driven Screenshots'